[package]
authors.workspace = true
edition.workspace = true
name = "firesquid"
readme = "README.md"
rust-version.workspace = true
version.workspace = true

[package.metadata.deb]
assets = [
    [
        "target/release/firesquid",
        "usr/bin/firesquid",
        "755",
    ],
    [
        "debian/firesquid.service",
        "/lib/systemd/system/firesquid.service",
        "644",
    ],
]
depends = "$auto, systemd"
extended-description = "Firesquid microVM manager daemon"
maintainer-scripts = "debian/scripts"
priority = "optional"
section = "admin"

[workspace]
members = ["."]
resolver = "3"

[workspace.package]
authors = ["Andrei Sousa <sousandrei@gmail.com>"]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.31", features = ["signal"] }
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
] }
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.38", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies]
bytes.workspace = true
clap.workspace = true
flate2.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
nix.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
