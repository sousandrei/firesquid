[package]
authors.workspace = true
edition.workspace = true
name = "firesquid"
readme = "README.md"
rust-version.workspace = true
version.workspace = true


[package.metadata.deb]
assets = [
    [
        "target/release/firesquid",
        "usr/bin/firesquid",
        "755",
    ],
    [
        "debian/firesquid.service",
        "/lib/systemd/system/firesquid.service",
        "644",
    ],
    [
        "assets/firecracker",
        "usr/bin/firecracker",
        "755",
    ],
    [
        "assets/rootfs.ext4",
        "opt/firesquid/rootfs.ext4",
        "644",
    ],
    [
        "assets/vmlinux",
        "opt/firesquid/vmlinux",
        "644",
    ],
]
depends = "$auto, systemd"
extended-description = "firesquid daemon"
maintainer-scripts = "debian/scripts"
priority = "optional"
section = "admin"


[workspace]
members = ["."]
resolver = "3"

[workspace.package]
authors = ["Andrei Sousa <sousandrei@gmail.com>"]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
bytes = "1.7"
chrono = "0.4"
clap = "4.6"
http-body-util = "0.1"
hyper = { version = "1.1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = [
    "http1",
    "server",
    "service",
    "tokio",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies]
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
